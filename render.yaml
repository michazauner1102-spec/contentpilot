# Render Blueprint — öffentliche Mock-Demo (keine API-Keys im Repo)
# Secrets nur manuell im Render-Dashboard für private Instanzen — nicht committen.
services:
  - type: web
    name: contentpilot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: FORCE_MOCK_ONLY
        value: "true"
      - key: INSIGHTS_MODE
        value: mock
