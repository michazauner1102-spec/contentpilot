# Render Blueprint — öffentliche Mock-Demo (keine API-Keys im Repo)
# Secrets nur manuell im Render-Dashboard für private Instanzen — nicht committen.
services:
  - type: web
    name: contentpilot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: FORCE_MOCK_ONLY
        value: "true"
      - key: INSIGHTS_MODE
        value: mock
      # Login braucht ein Session-Secret — Render generiert es selbst.
      - key: SESSION_SECRET
        generateValue: true
      # Ohne DATABASE_URL liegen Accounts in einer Datei und sind nach jedem
      # Deploy weg. Für echten Betrieb im Dashboard eine Postgres-URL setzen.
      # - key: DATABASE_URL
      #   sync: false
